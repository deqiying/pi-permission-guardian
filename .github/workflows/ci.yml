name: CI

# M7 门禁（docs/implementation-plan.md §10）：typecheck、test、配置/schema 校验、
# 打包内容校验（check:pack 内部执行 `npm pack --dry-run`，并断言 tarball 内容）。
# 双平台：Windows 分支上有平台条件逻辑（路径归一、MSYS 形式、UNC 不 realpath、
# 临时目录清理），只在 Ubuntu 上跑会漏掉这些分支的真实行为。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个平台都要出结论：先失败的那个不该掩盖另一个的结果。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # engines 声明的最低版本：CI 要守住这个下限。
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 提交版 schemas/guardian.schema.json 与 zod 输出的漂移由这轮单测捕获（FR-57）。
      - name: Test
        run: npm test

      - name: Validate reference config
        run: npm run validate:config

      # 放在最后：check:pack 会触发 prepack（重新生成 schema），
      # 漂移检查必须在那之前完成，否则会被就地修好而失去意义。
      - name: Verify package contents
        run: npm run check:pack
