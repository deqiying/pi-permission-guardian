name: CI

# M7 门禁：typecheck、test、配置/schema 校验、npm 包内容校验。
# 双平台：Windows 分支上有平台条件逻辑，只在 Ubuntu 上跑会漏掉真实行为。
#
# 触发策略：只在推送发布版本 tag（v*）时执行（加手动 workflow_dispatch）。
# verify 双平台全绿后，分别发布 npm 包和 PI-Desktop .piplug Release asset。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个平台都要出结论：先失败的那个不该掩盖另一个的结果。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # v4 的目标运行时是 Node 20，会被 runner 强制升到 Node 24 并报警告（v5 起是 Node 24）。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines 声明的最低版本：CI 要守住这个下限。
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 提交版 schemas/guardian.schema.json 与 zod 输出的漂移由这轮单测捕获（FR-57）。
      - name: Test
        run: npm test

      - name: Validate reference config
        run: npm run validate:config

      # 放在最后：check:pack 会触发 prepack（重新生成 schema），
      # 漂移检查必须在那之前完成，否则会被就地修好而失去意义。
      - name: Verify package contents
        run: npm run check:pack

  # 发布 npm：认证走 trusted publishing（OIDC），不需要长期 token，provenance 自动生成。
  publish:
    name: publish (npm)
    # 手动 workflow_dispatch 的 ref 是分支，不应发布——发布只由 tag 触发。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 发布 job 单独用 Node 24：它内置 npm 11.x，而 trusted publishing 要求 npm CLI >= 11.5.1。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          # 发布构建禁用缓存：缓存内容会影响发出去的产物。
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # tag 与 package.json 版本不一致就停在这里，而不是把错的版本号发上 registry。
      # 顺带推导 dist-tag：npm 拒绝把预发布版本隐式发到 latest（必须显式 --tag）。
      - name: Resolve release version
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 v${version} 不一致" >&2
            exit 1
          fi
          case "${version}" in
            *-*) dist_tag="${version#*-}"; dist_tag="${dist_tag%%.*}" ;;
            *) dist_tag="latest" ;;
          esac
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "dist_tag=${dist_tag}" >>"${GITHUB_OUTPUT}"

      # prepack 会重新生成 schemas/guardian.schema.json，因此发出去的 schema 与 zod 同步；
      # 漂移门禁（test 与 check:pack）已经在 verify 里跑过。
      - name: Publish to npm
        run: npm publish --tag "${{ steps.release.outputs.dist_tag }}"

  # PI-Desktop 分发：manifest/main.js 与扩展 bundle 放进 staging，
  # 再由官方 devkit 生成 store-compressed .piplug，并上传到同名 GitHub Release。
  publish-plugin:
    name: publish (PI-Desktop plugin)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install plugin dependencies
        run: npm ci

      - name: Resolve release version
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 v${version} 不一致" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Build plugin staging directory
        run: npm run build:plugin

      # 使用固定 commit 的 PI-Desktop devkit，确保 .piplug 格式和安装校验与主仓库一致。
      - name: Checkout PI-Desktop plugin devkit
        uses: actions/checkout@v7
        with:
          repository: vastsa/PI-Desktop
          ref: 0854ae0715965a10a55747363fb1c078cfa74cd6
          path: .pi-desktop-source
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tsconfig.base.json
            packages/plugin-sdk
            packages/plugin-devkit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Install PI-Desktop plugin devkit
        working-directory: .pi-desktop-source
        run: pnpm install --frozen-lockfile --filter @pi-desktop/plugin-devkit...

      - name: Build PI-Desktop plugin devkit
        working-directory: .pi-desktop-source
        run: |
          pnpm --filter @pi-desktop/plugin-sdk build
          pnpm --filter @pi-desktop/plugin-devkit build

      - name: Check plugin staging directory
        run: node .pi-desktop-source/packages/plugin-devkit/dist/cli.js check dist/pi-desktop

      - name: Pack .piplug
        run: node .pi-desktop-source/packages/plugin-devkit/dist/cli.js pack dist/pi-desktop --out dist/plugin

      - name: Calculate plugin artifact metadata
        id: artifact
        run: |
          asset="dist/plugin/deqiying.pi-permission-guardian-${{ steps.release.outputs.version }}.piplug"
          test -f "${asset}"
          echo "path=${asset}" >>"${GITHUB_OUTPUT}"
          echo "name=$(basename "${asset}")" >>"${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum "${asset}" | cut -d' ' -f1)" >>"${GITHUB_OUTPUT}"
          echo "size_bytes=$(wc -c < "${asset}")" >>"${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.artifact.outputs.path }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Write plugin artifact summary
        run: |
          {
            echo "### PI-Desktop plugin"
            echo
            echo "- Asset: [${{ steps.artifact.outputs.name }}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.artifact.outputs.name }})"
            echo "- Version: ${{ steps.release.outputs.version }}"
            echo "- SHA-256: \\`${{ steps.artifact.outputs.sha256 }}\\`"
            echo "- Size: ${{ steps.artifact.outputs.size_bytes }} bytes"
          } >>"${GITHUB_STEP_SUMMARY}"
